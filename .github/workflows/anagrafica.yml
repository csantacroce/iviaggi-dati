name: Scarica l'anagrafica degli impianti (Ministero)

# Scarica l'elenco completo dei distributori attivi (con coordinate, marchio e tipo di impianto)
# e lo salva nel ramo "mimit-anagrafica", separato da main: non tocca i dati dell'app e non avvia la pubblicazione.
# Serve a completare le aree di servizio (posizioni e abbinamento ai prezzi).
on:
  push:
    branches: [main]
    paths: [".github/workflows/anagrafica.yml"]
  # ogni lunedì mattina, dopo l'aggiornamento dei prezzi (il sito del Ministero di sera a volte non risponde)
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica anagrafica e prezzi
        run: |
          mkdir -p /tmp/out
          python - <<'EOF'
          import datetime, time, urllib.request
          base = "https://www.mimit.gov.it/images/exportCSV/"
          ua = "Mozilla/5.0 (compatible; iVIAGGI-dati/1.0; aggiornamento settimanale)"
          ok = 0
          for nome in ("prezzo_alle_8.csv", "anagrafica_impianti_attivi.csv"):
              for n in range(4):
                  try:
                      t = time.time()
                      req = urllib.request.Request(base + nome, headers={"User-Agent": ua, "Accept": "text/csv,text/plain,*/*"})
                      with urllib.request.urlopen(req, timeout=300) as r:
                          dati = r.read()
                      open("/tmp/out/" + nome, "wb").write(dati)
                      print(f"::notice::{nome}: {len(dati)} byte in {time.time()-t:.0f} s")
                      ok += 1
                      break
                  except Exception as e:
                      print(f"::warning::{nome}, tentativo {n+1}: {type(e).__name__}: {e} ({time.time()-t:.0f} s)")
                      time.sleep(30)
          open("/tmp/out/scaricato_il.txt", "w").write(datetime.datetime.utcnow().isoformat() + "Z\n")
          if not ok:
              raise SystemExit(1)
          EOF
      - name: Salva nel ramo mimit-anagrafica
        run: |
          cd /tmp/out
          git init -q
          git checkout -q -b mimit-anagrafica
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Anagrafica impianti e prezzi del Ministero ($(date -u +%F))"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" mimit-anagrafica
