name: Pubblica i dati dell'app

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "tools/**"
      - "site/**"
  # ogni lunedì alle 6:15 UTC (8:15 in Italia d'estate, 7:15 d'inverno): prezzi del Ministero e cambi BCE
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:
    inputs:
      aggiorna_prezzi:
        description: "Scarica adesso prezzi dei carburanti (Ministero) e cambi (BCE)"
        type: boolean
        default: false
      allow_shrink:
        description: "Consenti un calo di righe superiore al 10% (solo se è voluto)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Aggiorna prezzi e cambi (lunedì, a mano, o commit con "[aggiorna prezzi]")
        id: aggiorna
        if: github.event_name == 'schedule' || inputs.aggiorna_prezzi || contains(github.event.head_commit.message, '[aggiorna prezzi]')
        run: python tools/aggiorna_settimanale.py
      - name: Controlla l'Excel e costruisci il database
        id: build
        continue-on-error: true
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '0' }}
          PREZZI_AUTOMATICI: ${{ steps.aggiorna.outcome == 'success' && '1' || '0' }}
        run: python tools/build.py
      - name: Salva l'esito (anche se ci sono errori)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data source
          if ! git diff --cached --quiet; then
            git commit -m "Dati: esito della pubblicazione${{ steps.aggiorna.outcome == 'success' && ' (prezzi e cambi aggiornati)' || '' }}"
            git pull --rebase
            git push
          fi
      - name: Prepara il sito
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/manifest.json data/iviaggi_database.sqlite data/status.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Segnala l'errore se la costruzione è fallita
        if: steps.build.outcome == 'failure'
        run: |
          echo "La costruzione del database è fallita: vedi data/status.json"
          exit 1

  deploy:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
