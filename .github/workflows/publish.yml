name: Pubblica i dati dell'app

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "tools/**"
      - "site/**"
  # ogni mattina alle 6:15 UTC: prezzi del Ministero ogni giorno, cambi BCE una volta alla settimana
  # (se il Ministero non risponde riprova il giorno dopo)
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      aggiorna_prezzi:
        description: "Scarica adesso prezzi dei carburanti (Ministero) e cambi (BCE)"
        type: boolean
        default: false
      allow_shrink:
        description: "Consenti un calo di righe superiore al 10% (solo se è voluto)"
        type: boolean
        default: false
      prova_allarme:
        description: "Prova l'allarme: apre la segnalazione allarme-dati con un problema finto (si chiude al giro successivo)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write     # per la segnalazione automatica "allarme-dati" (controllo di salute)

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Aggiorna prezzi e cambi (lunedì, a mano, o commit con "[aggiorna prezzi]")
        id: aggiorna
        continue-on-error: true      # se il Ministero non risponde si prosegue: i dati restano quelli di prima
        # parte anche quando in source/ c'è il file dei prezzi caricato (pagina di aggiornamento o iPhone), qualunque sia il messaggio
        if: github.event_name == 'schedule' || inputs.aggiorna_prezzi || contains(github.event.head_commit.message, '[aggiorna prezzi]') || hashFiles('source/prezzi_mimit.csv') != ''
        env:
          FORZA: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: python tools/aggiorna_settimanale.py
      - name: Controlla l'Excel e costruisci il database
        id: build
        continue-on-error: true
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '0' }}
          PREZZI_AUTOMATICI: ${{ steps.aggiorna.outcome == 'success' && '1' || '0' }}
        run: python tools/build.py
      - name: Salva l'esito (anche se ci sono errori)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data source
          if ! git diff --cached --quiet; then
            git commit -m "Dati: esito della pubblicazione${{ steps.aggiorna.outputs.aggiornati == '1' && ' (prezzi aggiornati)' || '' }}"
            git pull --rebase
            git push
          fi
      - name: Prepara il sito
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/manifest.json data/iviaggi_database.sqlite data/status.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Segnala l'errore se la costruzione è fallita
        if: steps.build.outcome == 'failure'
        run: |
          echo "La costruzione del database è fallita: vedi data/status.json"
          exit 1

  deploy:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Controllo di salute (14/11/2026): verifica che prezzi, cambi, database e sito funzionino come impostato.
  # Se qualcosa non va apre una segnalazione (Issue) "allarme-dati" in italiano: GitHub la manda per email.
  # Quando torna tutto a posto la chiude da sola. Se è impostato il segreto HEALTHCHECK_URL avvisa anche
  # healthchecks.io, che manda una email se il controllo non arriva più (GitHub fermo o flusso disattivato).
  controllo:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # con l'esito appena salvato dal job build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controlla dati e sito
        run: python tools/controllo.py
      - name: Apri, aggiorna o chiudi la segnalazione
        env:
          GH_TOKEN: ${{ github.token }}
          ESITO_BUILD: ${{ needs.build.result }}
          ESITO_DEPLOY: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ inputs.prova_allarme }}" = "true" ]; then echo "- Prova dell'allarme avviata a mano: non c'è nessun problema vero, la segnalazione si chiuderà da sola al prossimo giro." >> controllo_problemi.md; fi
          if [ "$ESITO_BUILD" != "success" ]; then echo "- Il passaggio di costruzione su GitHub non è terminato ($ESITO_BUILD)." >> controllo_problemi.md; fi
          if [ "$ESITO_DEPLOY" != "success" ]; then echo "- La pubblicazione del sito su GitHub Pages non è terminata ($ESITO_DEPLOY)." >> controllo_problemi.md; fi
          sed -i '/^$/d' controllo_problemi.md
          gh label create allarme-dati --color D93F0B --description "Controllo automatico dei dati dell'app" --force >/dev/null
          aperta=$(gh issue list --label allarme-dati --state open --json number --jq '.[0].number')
          if [ -s controllo_problemi.md ]; then
            # firma del problema senza i numeri (giorni, conteggi), per riconoscere lo stesso problema nei giorni dopo
            firma=$(tr -d '0-9' < controllo_problemi.md | sha256sum | cut -c1-12)
            {
              echo "Il controllo automatico di oggi ha trovato questi problemi:"
              echo
              cat controllo_problemi.md
              echo
              echo "Esito completo: $RUN_URL"
              echo "Dettagli anche in data/aggiornamento_settimanale.json e data/status.json."
              echo
              echo "Finché il problema c'è, l'app continua a funzionare con i dati che ha già. La segnalazione si chiude da sola quando il controllo torna a posto."
              echo
              echo "<!-- firma: $firma -->"
            } > corpo.md
            if [ -z "$aperta" ]; then
              { echo "@csantacroce"; echo; cat corpo.md; } > corpo_nuovo.md
              gh issue create --title "⚠️ iVIAGGI: qualcosa non funziona nell'aggiornamento dei dati" --label allarme-dati --body-file corpo_nuovo.md
            else
              # commenta solo se il tipo di problema è cambiato (niente email uguali ogni giorno)
              prima=$(gh issue view "$aperta" --json body,comments --jq '[.body] + [.comments[].body] | last')
              if ! printf '%s' "$prima" | grep -qF "firma: $firma"; then
                gh issue comment "$aperta" --body-file corpo.md
              fi
            fi
            echo "esito=problemi" >> "$GITHUB_ENV"
          else
            if [ -n "$aperta" ]; then
              gh issue close "$aperta" --comment "✅ Il controllo automatico è tornato a posto: tutto funziona di nuovo come previsto. ($RUN_URL)"
            fi
            echo "esito=ok" >> "$GITHUB_ENV"
          fi
      - name: Avvisa healthchecks.io (se configurato)
        if: always()
        env:
          HC: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HC" ]; then echo "HEALTHCHECK_URL non impostato: salto"; exit 0; fi
          if [ "$esito" = "ok" ]; then curl -fsS -m 20 --retry 3 "$HC" >/dev/null; else curl -fsS -m 20 --retry 3 "$HC/fail" >/dev/null; fi
